# Publish the board to GitHub Pages.
#
# Deploying from a workflow rather than straight from the /docs folder buys two
# things that matter for a public repo:
#
#   1. The Apps Script endpoint is injected at deploy time from a repository
#      variable, so it never sits in the source. Anyone who loads the site can
#      still read it in devtools — this is not a secret — but it keeps the URL
#      out of GitHub code search and off the scrapers that trawl public repos.
#   2. The floor plan and its desk coordinates are checked against their
#      generator, so a hand-edit to one of them cannot silently put every pin in
#      the wrong place.
#
# Setup, once:
#   Settings > Pages          > Source: GitHub Actions
#   Settings > Secrets and variables > Actions > Variables > New variable
#       HOTDESK_API_URL   the .../exec URL of the Apps Script web app
#       HOTDESK_FLOORPLAN optional; defaults to assets/floorplan.svg

name: Deploy board

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Frontend parses
        run: |
          for f in docs/js/*.js dev/demo-server.js; do
            node --check "$f"
          done

      # Only while the generated placeholder plan is in use. Once a real floor
      # plan is dropped in and desks are placed with the mapper, the marker
      # line goes away and this check stands down on its own.
      - name: Floor plan matches its generator
        run: |
          if ! grep -q 'generated by dev/make-floorplan.py' docs/assets/floorplan.svg 2>/dev/null; then
            echo "Custom floor plan in use; skipping the generator check."
            exit 0
          fi
          python3 dev/make-floorplan.py
          if ! git diff --quiet -- docs/assets; then
            echo "::error file=docs/assets/demo-desks.tsv::The committed floor plan and desk coordinates do not match dev/make-floorplan.py. Run it and commit the result, or place desks with tools/desk-mapper.html instead of editing these by hand."
            git --no-pager diff --stat -- docs/assets
            exit 1
          fi

      - name: Write runtime config
        env:
          API_URL: ${{ vars.HOTDESK_API_URL }}
          FLOORPLAN: ${{ vars.HOTDESK_FLOORPLAN }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Set the HOTDESK_API_URL repository variable to the Apps Script /exec URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          case "$API_URL" in
            https://script.google.com/*/exec) ;;
            *) echo "::warning::HOTDESK_API_URL does not look like an Apps Script /exec URL." ;;
          esac
          # json.dumps rather than string interpolation, so a stray quote in the
          # variable cannot produce a broken or injected config file.
          python3 - <<'PY' > docs/js/config.js
          import json, os
          print('/* Generated at deploy time by .github/workflows/pages.yml.')
          print('   Edit the HOTDESK_API_URL repository variable, not this file. */')
          print('window.HOTDESK_CONFIG = {')
          print('  apiUrl: %s,' % json.dumps(os.environ['API_URL'].strip()))
          print('  floorplan: %s,' % json.dumps(os.environ.get('FLOORPLAN', '').strip()
                                                or 'assets/floorplan.svg'))
          print('};')
          PY

      - name: Bundle is publishable
        run: |
          test -f docs/index.html
          test -f docs/.nojekyll
          if grep -q 'PASTE_YOUR' docs/js/config.js; then
            echo "::error::config.js still holds the placeholder URL."
            exit 1
          fi
          node --check docs/js/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
